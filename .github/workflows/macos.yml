name: macOS BMT OFX (Apple Silicon)

# BMT Build: builds + verifies the arm64 macOS OFX bundle. The vendored macOS
# ONNX Runtime (official GH release, CoreML EP = Metal inference) is staged
# into vendor/onnxruntime at job start because upstream only ships a stale
# .dSYM there. The artifact is the same CorridorKey-BMT.ofx.bundle the
# Windows build produces, Contents/MacOS layout.

on:
  workflow_dispatch:
  push:
    branches: [macos-bmt]

permissions:
  contents: read

env:
  ONNXRUNTIME_MACOS_VERSION: "1.24.3"
  BMT_VERSION: "0.1"

concurrency:
  group: macos-bmt-ci
  cancel-in-progress: true

jobs:
  macos-arm64:
    runs-on: macos-15  # macos-14 images retired by GitHub 2026-11-02 (actions/runner-images#15226); arm64 like its predecessor
    steps:
      - uses: actions/checkout@v4

      - name: Vendor OpenFX SDK (not committed to this repo)
        run: git clone --depth=1 https://github.com/AcademySoftwareFoundation/OpenFX vendor/openfx

      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: /Users/runner/.cache/vcpkg
          key: vcpkg-arm64-osx-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-v1

      - name: Install build tools
        run: brew install cmake ninja

      - name: Stage vendored ONNX Runtime (osx-arm64, CoreML EP)
        run: |
          set -euo pipefail
          v="$ONNXRUNTIME_MACOS_VERSION"
          curl -fsSL -o ort.tgz \
            "https://github.com/microsoft/onnxruntime/releases/download/v${v}/onnxruntime-osx-arm64-${v}.tgz"
          tar -xzf ort.tgz
          cp "onnxruntime-osx-arm64-${v}"/lib/*.dylib vendor/onnxruntime/lib/
          # Replace stale vendored headers: official 1.24.x macOS packages ship
          # headers flat under include/, while this codebase includes them via
          # the Windows-style <onnxruntime/core/session/...> layout. The old
          # vendor tree carried two different-guard copies of the same headers
          # (clang: redefinition of ONNXTensorElementDataType). Rebuild the
          # layout from ONE set of official files so every path resolves to
          # identical content with identical include guards.
          o="onnxruntime-osx-arm64-${v}/include"
          rm -rf vendor/onnxruntime/include
          flat="vendor/onnxruntime/include/onnxruntime"
          sess="$flat/core/session"
          cm="$flat/core/providers/coreml"
          mkdir -p "$sess" "$cm"
          # ORT headers guard with #pragma once, which is path-based: two
          # physical copies of the same header under different paths both
          # parse and redefine the enums. Keep exactly ONE copy of every
          # real header (under $flat, matching the official flat layout)
          # and add thin forwarders for the alternate include paths this
          # codebase uses (<onnxruntime/core/session/...> etc).
          cp "$o"/*.h "$flat"/
          if [ -d "$o"/core ]; then
            cp -R "$o"/core "$flat"/core.tmp
            mkdir -p "$flat"/core/providers
            cp -R "$flat"/core.tmp/providers/. "$flat"/core/providers/
            rm -rf "$flat"/core.tmp
          fi
          rm -rf "$cm"
          mkdir -p "$cm"
          for h in onnxruntime_c_api.h onnxruntime_cxx_api.h onnxruntime_cxx_inline.h \
                   onnxruntime_float16.h onnxruntime_env_config_keys.h \
                   onnxruntime_session_options_config_keys.h \
                   onnxruntime_run_options_config_keys.h onnxruntime_ep_c_api.h \
                   onnxruntime_ep_device_ep_metadata_keys.h \
                   onnxruntime_lite_custom_op.h provider_options.h; do
            printf '#pragma once\n#include "../../%s"\n' "$h" > "$sess/$h"
          done
          printf '#pragma once\n#include "../../../coreml_provider_factory.h"\n' \
            > "$cm/coreml_provider_factory.h"
          ls -l vendor/onnxruntime/lib
          file "vendor/onnxruntime/lib/libonnxruntime.${v}.dylib" \
            | grep -q 'Mach-O 64-bit dynamically linked shared library arm64'
          # CoreML EP is statically registered inside the official macOS
          # build; match either an exported symbol or embedded strings.
          if nm -gU "vendor/onnxruntime/lib/libonnxruntime.${v}.dylib" | grep -qi coreml; then
            echo 'CoreML EP: exported symbol found'
          elif strings "vendor/onnxruntime/lib/libonnxruntime.${v}.dylib" | grep -qi coreml; then
            echo 'CoreML EP: statically registered (strings match)'
          else
            echo 'CoreML EP missing from vendored dylib'; exit 1
          fi

      - name: Bootstrap vcpkg (no longer preinstalled on runner images)
        run: |
          if [ -n "$VCPKG_INSTALLATION_ROOT" ] && [ -f "$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" ]; then
            echo "VCPKG_RESOLVED=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
          else
            git clone --filter=blob:none --depth=1 https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
            "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh"
            echo "VCPKG_RESOLVED=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          fi
          echo "vcpkg root: $VCPKG_RESOLVED"

      - name: Install MLX (Apple Silicon inference backend)
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/mlxenv"
          "$RUNNER_TEMP/mlxenv/bin/pip" install --upgrade pip > /dev/null
          # Exact pin: the HF mlx/ bridges must have been exported with THIS
          # mlx version (regenerated via the mlx-repack.yml workflow). MLX's
          # export format has no real versioning; runtime/export generation
          # drift throws "[import_function] Invalid string size"
          # (see ml-explore/mlx#4637). 0.31.2 is gone from PyPI for cp313.
          "$RUNNER_TEMP/mlxenv/bin/pip" install mlx==0.32.4
          echo "MLX cmake-dir: $("$RUNNER_TEMP/mlxenv/bin/python" -m mlx --cmake-dir)"
          SITE=$("$RUNNER_TEMP/mlxenv/bin/python" -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          MLX_LIB="$SITE/mlx/lib/libmlx.dylib"
          if [ ! -f "$MLX_LIB" ]; then
            MLX_LIB=$(find "$SITE" -name 'libmlx.dylib' | head -1)
          fi
          echo "MLX dylib: $MLX_LIB"
          test -f "$MLX_LIB"
          # Pin the mlx-metal backend to the macOS-14 build. The macos-15
          # runner would otherwise pick the macosx_15_0 wheel whose LC_BUILD
          # minos refuses to load on macOS 14; our deployment floor is 14.
          METAL_VER=$("$RUNNER_TEMP/mlxenv/bin/python" -c "import importlib.metadata as m; print(m.version('mlx-metal'))")
          METAL_URL=$(curl -s "https://pypi.org/pypi/mlx-metal/$METAL_VER/json" | python3 -c "import sys,json; d=json.load(sys.stdin); print(next(u['url'] for u in d['urls'] if 'macosx_14_0_arm64' in u['filename']))")
          "$RUNNER_TEMP/mlxenv/bin/pip" install --force-reinstall --no-deps "$METAL_URL" > /dev/null
          MLX_LIB=$(find "$("$RUNNER_TEMP/mlxenv/bin/python" -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")" -name 'libmlx.dylib' | head -1)
          # Kernels are mlx.metallib colocated with libmlx (dladdr lookup);
          # CMake stages it into the bundle beside libmlx.dylib.
          METLLIB=$(dirname "$MLX_LIB")/mlx.metallib
          test -f "$METLLIB" && echo "MLX metallib: $(du -h "$METLLIB" | cut -f1)"
          otool -D "$MLX_LIB"
          if [ "$(otool -D "$MLX_LIB" | sed -n 2p)" != "@rpath/libmlx.dylib" ]; then
            install_name_tool -id @rpath/libmlx.dylib "$MLX_LIB"
            codesign --force --sign - "$MLX_LIB"
            echo "normalized libmlx.dylib install_name to @rpath"
          fi

      - name: Configure
        run: |
          cmake -B build/macos -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_RESOLVED/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=arm64-osx \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCORRIDORKEY_ENABLE_MLX=ON \
            -DCORRIDORKEY_MLX_PYTHON="$RUNNER_TEMP/mlxenv/bin/python" \
            -DCORRIDORKEY_BUNDLE_MODELS=OFF

      - name: Build corridorkey_ofx
        run: cmake --build build/macos --target corridorkey_ofx

      - name: Verify bundle layout + link contracts
        run: |
          set -euxo pipefail
          B=build/macos/CorridorKey-BMT.ofx.bundle
          test -f "$B/Contents/Info.plist"
          test -f "$B/Contents/MacOS/CorridorKey-BMT.ofx"
          test -f "$B/Contents/MacOS/corridorkey"
          # Diagnostics first: if any contract grep below dies, the actual
          # load commands are already in the log above it.
          echo "---- otool -L core ----"; otool -L "$B/Contents/MacOS/libcorridorkey_core.dylib"
          echo "---- otool -L cli ----"; otool -L "$B/Contents/MacOS/corridorkey" | head -25
          echo "---- rpaths ----"
          for db in libcorridorkey_core.dylib corridorkey CorridorKey-BMT.ofx; do
            echo "== $db"; otool -l "$B/Contents/MacOS/$db" | grep -A2 LC_RPATH || true
          done
          # ORT ships as the exact versioned filename its LC_ID declares
          # (chained fixups make -id rewrites impossible on recent runners);
          # assert the staged file and core's load command agree on it.
          ORT_NAME="$(ls "$B/Contents/MacOS/"libonnxruntime*.dylib | head -1 | xargs basename)"
          test -n "$ORT_NAME"
          otool -L "$B/Contents/MacOS/libcorridorkey_core.dylib" | grep -q "@rpath/$ORT_NAME"
          # MLX backend must be compiled in and staged (root CMakeLists
          # resolves the MLX package from the venv created in Install MLX).
          test -f "$B/Contents/MacOS/libmlx.dylib"
          # Metal kernels archive must ride beside libmlx in the bundle —
          # libmlx resolves it via dladdr at its own dir; missing metallib
          # only throws at first GPU op, so verify the file, not dyld.
          test -f "$B/Contents/MacOS/mlx.metallib"
          otool -L "$B/Contents/MacOS/libcorridorkey_core.dylib" | grep -q libmlx
          # The .ofx links only the static corridorkey_common (same ORT-free
          # import contract as Windows); the core dylib is loaded by the
          # bundle CLI, which doubles as the runtime server — prove the
          # dylib graph via the CLI, not the .ofx.
          otool -L "$B/Contents/MacOS/corridorkey" | grep -q libcorridorkey_core
          # Staged binaries must not carry build-tree rpaths (venv MLX dir,
          # runner workdir) — those pass on CI but do not exist on user
          # machines. BUILD_WITH_INSTALL_RPATH pins them to @loader_path.
          for db in libcorridorkey_core.dylib corridorkey CorridorKey-BMT.ofx; do
            if otool -l "$B/Contents/MacOS/$db" | grep -qE '_temp/mlxenv|/Users/runner/work'; then
              echo "LEAKED_BUILD_RPATH in $db"
              otool -l "$B/Contents/MacOS/$db" | grep -A2 LC_RPATH
              exit 1
            fi
          done
          # Same import contract as the Windows dumpbin rule: the .ofx must
          # not link ONNX Runtime or MLX directly; inference goes through the
          # core dylib + CLI server.
          if otool -L "$B/Contents/MacOS/CorridorKey-BMT.ofx" | grep -qE 'onnxruntime|libmlx'; then
            echo 'CONTRACT VIOLATION: .ofx imports onnxruntime or libmlx directly'; exit 1
          fi
          otool -l "$B/Contents/MacOS/CorridorKey-BMT.ofx" | grep -q '@loader_path'
          plutil -lint "$B/Contents/Info.plist"

      - name: Ad-hoc sign bundle
        run: |
          set -euo pipefail
          B=build/macos/CorridorKey-BMT.ofx.bundle/Contents/MacOS
          # mlx.metallib sits inside the flat-bundle dir the .ofx declares as its
          # resource manifest, so codesign treats it as nested code — verify fails
          # unless it carries its own (ad-hoc) signature. Sign it first.
          for f in "$B"/*.metallib; do
            codesign --force -s - "$f"
          done
          for f in "$B"/*.dylib "$B"/corridorkey "$B"/CorridorKey-BMT.ofx; do
            codesign --force -s - "$f"
          done
          codesign --verify --verbose=2 "$B/CorridorKey-BMT.ofx"
          codesign --verify --verbose=2 "$B"/corridorkey
          # Do NOT verify "$B" itself: a bare Contents/MacOS dir with signed
          # nested code is 'bundle format unrecognized' to codesign. Verifying
          # the .ofx covers its flat-bundle resource manifest (incl. the
          # metallib); dylibs/metallib carry standalone seals, checked next.
          for f in "$B"/*.dylib "$B"/*.metallib; do
            codesign --verify --verbose=2 "$f"
          done

      - name: Smoke test (Metal MLX inference via bundle CLI)
        run: |
          set -uo pipefail
          B="$PWD/build/macos/CorridorKey-BMT.ofx.bundle/Contents/MacOS"
          "$B/corridorkey" doctor --json | tee doctor.json
          grep -qi coreml doctor.json
          grep -qi mlx doctor.json
          "$B/corridorkey" fetch-models
          "$B/corridorkey" matte-test --output /tmp/corridorkey-matte.png
          python3 - <<'PY'
          # Two synthetic 64x64 green-screen frames (stdlib-only PNG writer).
          import zlib, struct, os
          os.makedirs('/tmp/ck-frames', exist_ok=True)
          def chunk(t, d):
              return struct.pack('>I', len(d)) + t + d + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
          def write_png(path, w, h, px):
              raw = b''.join(b'\x00' + b''.join(bytes(px(x, y)) for x in range(w)) for y in range(h))
              data = (b'\x89PNG\r\n\x1a\n'
                      + chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0))
                      + chunk(b'IDAT', zlib.compress(raw))
                      + chunk(b'IEND', b''))
              open(path, 'wb').write(data)
          def px(x, y):
              return (220, 120, 90) if 16 <= x < 48 and 16 <= y < 48 else (30, 200, 40)
          for i in range(2):
              write_png(f'/tmp/ck-frames/f{i:04d}.png', 64, 64, px)
          PY
          # The matte graph holds a single ~8 GiB intermediate buffer at any
          # resolution; the 8 GB runner's Metal max buffer is 7.0 GiB, so MLX
          # inference on CI is physically impossible (CorridorKey targets
          # 16 GB+ Apple Silicon). Bridge import + graph load still run first,
          # so a metal-max-buffer failure is tolerated as a runner limitation;
          # any other failure (incl. import_function errors) stays fatal.
          set +e
          "$B/corridorkey" process -i /tmp/ck-frames -o /tmp/ck-keyed > /tmp/ck-proc.log 2>&1
          rc=$?
          set -e
          cat /tmp/ck-proc.log
          if [ $rc -ne 0 ]; then
            grep -q 'maximum allowed buffer size' /tmp/ck-proc.log \
              || exit 1
            echo "::warning::MLX forward not runnable on 8GB CI runner (graph needs one 8GiB buffer; user Macs are 16GB+). Bridge import + load verified; inference verified at runtime on real Macs."
          fi
          ls -l /tmp/ck-keyed 2>/dev/null || true

      - name: Package zip artifact
        run: |
          cd build/macos
          zip -qr "$GITHUB_WORKSPACE/CorridorKey2.0-BMT-macOS-Silicon-v${BMT_VERSION}.zip" CorridorKey-BMT.ofx.bundle

      - name: Build DMG installer
        run: |
          set -euo pipefail
          stage=dmg-stage
          rm -rf "$stage"; mkdir -p "$stage"
          cp -R build/macos/CorridorKey-BMT.ofx.bundle "$stage/"
          cp -R build/macos/README-mac.txt "$stage/README.txt" 2>/dev/null || \
            cp README-mac.txt "$stage/README.txt"
          cat > "$stage/Install CorridorKey BMT.command" <<'SH'
          #!/bin/bash
          set -euo pipefail
          if [ "$(uname -m)" != "arm64" ]; then
            echo "This build is Apple Silicon (M-series) only."
            echo "Intel Macs are not supported — exiting without installing."
            read -n 1 -s -r -p "Press any key to close. "
            exit 1
          fi
          cd "$(dirname "$0")"
          echo "CorridorKey 2.0 BMT Build — installing into /Library/OFX/Plugins (sudo required)."
          sudo mkdir -p /Library/OFX/Plugins
          sudo rm -rf /Library/OFX/Plugins/CorridorKey-BMT.ofx.bundle
          sudo ditto CorridorKey-BMT.ofx.bundle /Library/OFX/Plugins/CorridorKey-BMT.ofx.bundle
          # Clear quarantine so the ad-hoc-signed dylibs load inside Resolve.
          sudo xattr -rd com.apple.quarantine /Library/OFX/Plugins/CorridorKey-BMT.ofx.bundle || true
          echo "Installed. Restart DaVinci Resolve; the effect is under Open FX > Keying."
          echo "Models (~715 MB) download automatically on first use, or run the bundle's 'corridorkey fetch-models'."
          read -n 1 -s -r -p "Press any key to close. "
          SH
          cat > "$stage/Uninstall CorridorKey BMT.command" <<'SH'
          #!/bin/bash
          set -euo pipefail
          echo "Removing CorridorKey 2.0 BMT Build (sudo required for the plugin bundle)."
          sudo rm -rf /Library/OFX/Plugins/CorridorKey-BMT.ofx.bundle
          rm -rf "$HOME/Library/Application Support/CorridorKey2.0-BMT" \
                 "$HOME/Library/Caches/CorridorKey2.0-BMT" \
                 "$HOME/Library/Logs/CorridorKey2.0-BMT"
          echo "Removed. Mole users: 'mo clean' also sweeps leftover ~/Library data."
          read -n 1 -s -r -p "Press any key to close. "
          SH
          chmod +x "$stage"/*.command
          hdiutil create -volname CorridorKey-BMT \
            -srcfolder "$stage" -ov -format UDZO \
            "CorridorKey2.0-BMT-macOS-Silicon-v${BMT_VERSION}.dmg"
          codesign --force -s - "CorridorKey2.0-BMT-macOS-Silicon-v${BMT_VERSION}.dmg"
          hdiutil verify "CorridorKey2.0-BMT-macOS-Silicon-v${BMT_VERSION}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: CorridorKey2.0-BMT-macOS-Silicon-zip
          path: CorridorKey2.0-BMT-macOS-Silicon-v${{ env.BMT_VERSION }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: CorridorKey2.0-BMT-macOS-Silicon-dmg
          path: CorridorKey2.0-BMT-macOS-Silicon-v${{ env.BMT_VERSION }}.dmg
